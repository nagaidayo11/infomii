<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Infomii Instagram — 【投稿タイトル】</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shared.css" />
    <style>
      .slide-cover .hero {
        --hero-image: url("../assets/cover-desk-phone.png");
      }
      .slide-content[data-slide="02"] .art {
        --art-image: url("../assets/problem-desk-papers.png");
      }
      .slide-content[data-slide="03"] .art {
        --art-image: url("../assets/solution-phone-qr.png");
      }
      .slide-content[data-slide="04"] .art {
        --art-image: url("../assets/compare-paper-pdf-phone.png");
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <article class="slide slide-cover" data-slide="01">
        <div class="brand-bar" aria-hidden="true"></div>
        <div class="brand-band" aria-hidden="true"></div>
        <header class="brand-header">
          <div class="brand-lockup">
            <img src="../assets/app-icon-mark.png" alt="" />
            <span>Infom<span class="brand-accent">ii</span></span>
          </div>
          <span class="brand-tag">ホテル向け 案内ツール</span>
        </header>
        <div class="slide-card slide-card--cover">
          <div class="copy">
            <h1 class="title title--cover">
              <span class="title-cover__main">【メイン】</span>
              <span class="title-cover__sub">【サブ】</span>
            </h1>
          </div>
          <div class="hero" aria-hidden="true"><div class="hero-fade"></div></div>
        </div>
        <div class="page-dot"><span class="page-dot__num">1</span><span class="page-dot__sep"> / 5</span></div>
      </article>

      <article class="slide slide-content" data-slide="02">
        <div class="brand-bar" aria-hidden="true"></div>

          </div>
          <span class="brand-tag">ホテル向け 案内ツール</span>
        </header>
        <div class="body">
          <div class="art" aria-hidden="true"></div>
          <div class="text-panel">
            <div class="kicker"><span class="kicker-num">01</span><span class="kicker-label">【ラベル】</span></div>
            <h2 class="title title--content">【見出し】</h2>
            <ul class="bullets">
              <li>【箇条書き1】</li>
              <li>【箇条書き2】</li>
              <li>【箇条書き3】</li>
            </ul>
            <p class="note">【補足1行（任意）】</p>
          </div>
        </div>
        <div class="page-dot"><span class="page-dot__num">2</span><span class="page-dot__sep"> / 5</span></div>
      </article>

      </article>
    </div>
  </body>
</html>
