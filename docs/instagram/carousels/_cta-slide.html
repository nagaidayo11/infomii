<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Infomii Instagram — 共通CTA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body>
    <div class="stage">
      <article class="slide slide-cta" data-slide="05" aria-label="5 / 5 CTA">
        <div class="brand-bar" aria-hidden="true"></div>
        <div class="brand-band" aria-hidden="true"></div>
        <header class="brand-header">
          <div class="brand-lockup">
            <img src="../assets/app-icon-mark.png" alt="" />
            <span>Infom<span class="brand-accent">ii</span></span>
          </div>
          <span class="brand-tag">ホテル向け 案内ツール</span>
        </header>
        <div class="cta-card">
          <div
            class="cta-art"
            style="--cta-art-image: url('../assets/cta-friendly-desk.png')"
            aria-hidden="true"
          ></div>
          <div class="cta-panel">
            <h2 class="cta-headline">まずは無料で<br />試せます</h2>
            <p class="cta-lead">クレジットカード不要</p>
            <div class="cta-btn">プロフィールのリンクから</div>
            <p class="cta-foot">infomii.com</p>
          </div>
        </div>
        <div class="page-dot"><span class="page-dot__num">5</span><span class="page-dot__sep"> / 5</span></div>
      </article>
    </div>
  </body>
</html>
